name: Trigger Website Update

# Triggers electerm.org + history.electerm.org to refresh the Android release
# info (download links, latest version, APK archive data) whenever a new
# electerm-android release is published.
# Mirrors the same workflow in the electerm (desktop) repo.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  trigger-website-update:
    runs-on: ubuntu-latest
    environment: build
    strategy:
      matrix:
        repository:
          - electerm/electerm.org
          - electerm/history.electerm.org
    steps:
      - name: Trigger ${{ matrix.repository }} repository workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.PAT_REPO_TOKEN }}
          repository: ${{ matrix.repository }}
          event-type: electerm-release
