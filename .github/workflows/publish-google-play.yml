name: Publish Android AAB to Google Play

# Builds a signed Android App Bundle (.aab) and uploads it to Google Play.
#
# Required repository secrets (gh secret set NAME):
#   SERVER_SECRET                        JWT secret for the on-device electerm server
#   ANDROID_RELEASE_KEYSTORE_BASE64      base64 of the upload-key .keystore
#   ANDROID_RELEASE_KEYSTORE_PASSWORD    keystore store password
#   ANDROID_RELEASE_KEY_ALIAS            keystore key alias
#   ANDROID_RELEASE_KEY_PASSWORD         keystore key password
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON     the full JSON of a Play service account
#
# The first upload for a brand-new package must be done MANUALLY from the Play
# Console (the Android Publisher API only knows a package after one manual
# upload). This workflow therefore refuses to run until that has happened.

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to publish to'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: 'Release status (draft = staged, completed = goes live in the track)'
        type: choice
        options: [draft, completed, inProgress, halted]
        default: draft
      release_notes:
        description: 'Release notes for this version'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  publish:
    name: Build AAB and upload to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default `packages` is "tools platform-tools", but Google
          # removed the legacy `tools` package, so sdkmanager exits 1 with
          # "Warning: Failed to find package 'tools'"
          # (https://github.com/android-actions/setup-android/issues/537).
          # Override it here so only supported packages get installed.
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: ci init
        run: npm config set legacy-peer-deps true

      - name: Install root dependencies (electerm + build tooling)
        run: npm i

      - name: Install Capacitor dependencies
        run: npm --prefix build/android install

      - name: Build web frontend + Node.js backend bundle
        env:
          # JWT secret for the on-device electerm server. Baked into the bundle
          # at build time by build/android/build.mjs.
          SERVER_SECRET: ${{ secrets.SERVER_SECRET }}
        run: npm run build:android

      - name: Add Android platform (first run only)
        run: cd build/android && [ -d android ] || npx cap add android

      - name: Sync Capacitor (copies web assets + native plugins)
        run: cd build/android && npx cap sync android

      - name: Ensure nodejs-mobile gradle variable is defined
        # @capawesome/capacitor-nodejs expects $nodejsMobileVersion to be set.
        # Append on its own line (variables.gradle has no trailing newline, so a
        # plain `echo >>` would concatenate onto the closing `}` and break Gradle).
        run: |
          cd build/android/android
          grep -q "nodejsMobileVersion" variables.gradle || \
            printf '\next.nodejsMobileVersion = "18.20.4-capawesome.1"\n' >> variables.gradle

      - name: Apply icon / splash overlay
        # CI does NOT run `build.mjs --overlay-only`; the native project is
        # regenerated from scratch by `cap add android` + `cap sync android`, so
        # the overlay has to be copied in by hand — same as build-android.yml.
        run: |
          # AndroidManifest.xml must go at app/src/main/, NOT inside res/.
          MANIFEST_SRC=build/android/res-overlay/AndroidManifest.xml
          MANIFEST_DST=build/android/android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST_SRC" ]; then
            cp "$MANIFEST_SRC" "$MANIFEST_DST"
            echo "Overlayed AndroidManifest.xml -> $MANIFEST_DST"
          fi

          # Custom MainActivity.java / bridges live under res-overlay/java/ and
          # must go to the Gradle source tree (app/src/main/java/), NOT res/.
          JAVA_SRC=build/android/res-overlay/java
          JAVA_DST=build/android/android/app/src/main/java
          if [ -d "$JAVA_SRC" ]; then
            mkdir -p "$JAVA_DST"
            cp -r "$JAVA_SRC/." "$JAVA_DST/"
            echo "Overlayed java sources -> $JAVA_DST"
          fi

          # Copy all resource dirs (drawable, mipmap-*, values, xml) into res/.
          cp -r build/android/res-overlay/. build/android/android/app/src/main/res/

          # The bulk cp above also copies res-overlay/java/ into res/java/ —
          # Java sources must NOT live inside res/. Remove the stray copy.
          rm -rf build/android/android/app/src/main/res/java

          # Remove Capacitor's default resources that conflict with / shadow
          # the electerm overlay (see build-android.yml for the full rationale).
          RES=build/android/android/app/src/main/res
          rm -f "$RES/drawable-v24/ic_launcher_foreground.xml"
          rm -f "$RES/values/ic_launcher_background.xml"
          find "$RES" -type f -name 'splash.png' -path '*/drawable*' -delete

      - name: Set versionCode / versionName
        # Capacitor's template hardcodes versionCode 1 / versionName "1.0".
        # Google Play requires versionCode to increase with every upload and
        # rejects duplicates, so derive it from the upstream package.json
        # version: major*1000000 + minor*1000 + patch (5.8.0 -> 5008000).
        id: version
        run: |
          node build/android/scripts/set-version.mjs \
            build/android/android/app/build.gradle
          grep -E "versionCode|versionName" build/android/android/app/build.gradle
          {
            echo "version=$(node -p "require('./package.json').version")"
            echo "version_code=$(node -e "const[a,b,c]='$(node -p "require('./package.json').version")'.split('.').map(Number);console.log(a*1000000+b*1000+c)")"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Gradle distribution
        # The Gradle wrapper downloads gradle-8.14.3-all.zip (~150 MB) from
        # services.gradle.org on every run. If that download fails with a
        # transient network error, the entire build fails. Caching the extracted
        # distribution avoids the download entirely on subsequent runs.
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('build/android/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-${{ runner.os }}-

      - name: Build signed release AAB
        # `bundleRelease` (not assembleRelease) — Play requires an App Bundle.
        # The android.injected.signing.* properties are the same ones
        # build-android.yml uses for the APK; they apply to bundle signing too.
        # AABs are always split per-ABI by Play, so no `splits` block is needed.
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          cd build/android/android && chmod +x gradlew
          KEYSTORE="$PWD/app/release.keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password="$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_RELEASE_KEY_PASSWORD"

      - name: Verify the AAB
        # Fail fast on the things Play would reject anyway: a missing/unsigned
        # bundle, a versionCode that did not move, or a wrong target SDK.
        run: |
          node build/android/scripts/verify-aab.mjs \
            build/android/android/app/build/outputs/bundle/release/app-release.aab \
            "${{ steps.version.outputs.version_code }}" \
            "${{ steps.version.outputs.version }}" \
            36

      - name: Upload AAB (artifact)
        # Always keep the bundle around: the very first upload for a new package
        # has to be done by hand from the Play Console, and this artifact is
        # exactly the file to drag in there.
        uses: actions/upload-artifact@v4
        with:
          name: electerm-android-aab
          path: build/android/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Write release notes
        # The upload action reads per-locale release notes from a directory of
        # files named whatsnew-<BCP47 locale>. Play shows these in the store
        # listing. If no notes were supplied, fall back to a generic line so
        # the directory is never empty (the action requires at least one file).
        env:
          NOTES: ${{ inputs.release_notes }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p distribution/whatsnew
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > distribution/whatsnew/whatsnew-en-US
          else
            printf 'electerm for Android v%s\n' "$VERSION" \
              > distribution/whatsnew/whatsnew-en-US
          fi
          cat distribution/whatsnew/whatsnew-en-US

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.electerm.electerm
          releaseFiles: build/android/android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.track }}
          status: ${{ inputs.status }}
          releaseName: v${{ github.run_number }}-${{ github.sha }}
          whatsNewDirectory: distribution/whatsnew

      - name: Summarise
        env:
          TRACK: ${{ inputs.track }}
          STATUS: ${{ inputs.status }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          {
            echo "### Google Play upload"
            echo ""
            echo "- track: \`${TRACK}\`"
            echo "- status: \`${STATUS}\`"
            echo "- package: \`org.electerm.electerm\`"
            echo "- version: \`${VERSION}\`"
            echo "- versionCode: \`${VERSION_CODE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
